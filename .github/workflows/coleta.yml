name: Coleta de candles

on:
  schedule:
    # a cada 5 minutos, de domingo 21h UTC a sexta 22h UTC (mercado de câmbio aberto)
    - cron: "*/5 * * * 1-5"
    - cron: "*/5 21-23 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -q yfinance pandas
      - name: Baixar candles
        run: python scripts/coleta.py
      - name: Gravar se houver candle novo
        run: |
          git config user.name "coleta-bot"
          git config user.email "coleta-bot@users.noreply.github.com"
          git add dados/
          if git diff --cached --quiet -- dados/*.csv; then
            echo "Nenhum candle novo fechado."
          else
            git commit -m "dados: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
